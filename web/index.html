<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CrossWay</title>
    <link rel="icon" href="/logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      html,body,#root{min-height:100dvh}
      html{
        background-color:#eef2ff;
        background-image:
          radial-gradient(90% 55% at 8% -8%,rgb(167 139 250 / .5),transparent 58%),
          radial-gradient(70% 48% at 100% 0%,rgb(56 189 248 / .32),transparent 54%),
          radial-gradient(55% 40% at 85% 100%,rgb(196 181 253 / .38),transparent 58%),
          radial-gradient(45% 32% at 0% 90%,rgb(125 211 252 / .22),transparent 52%),
          linear-gradient(180deg,#f4f1ff 0%,#eef2ff 46%,#f7f8fc 100%);
        background-attachment:fixed;
      }
      html.dark{
        background-color:#090b16;
        background-image:
          radial-gradient(90% 55% at 8% -8%,rgb(124 58 237 / .38),transparent 58%),
          radial-gradient(70% 48% at 100% 0%,rgb(14 165 233 / .2),transparent 54%),
          radial-gradient(55% 40% at 85% 100%,rgb(91 33 182 / .28),transparent 58%),
          radial-gradient(45% 32% at 0% 90%,rgb(56 189 248 / .1),transparent 52%),
          linear-gradient(180deg,#0c1020 0%,#0a0d18 46%,#080a12 100%);
      }
      body{margin:0;background:transparent}
    </style>
    <script>
      try {
        var t = localStorage.getItem("cw-theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
